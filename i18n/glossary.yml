canonical_locale: ja-JP
terms:
  対象固有性:
    en: target specificity
    note_ja: 既存分類に還元できない具体性、例外、対象との距離を含む。
  他者性:
    en: otherness
    note_ja: 対象を完全に説明・所有したとみなさないための距離。
    note_ja: 割り当てられた機能を超えて、想定外の利用・意味・関係を生む性質。
  自律性:
    en: autonomy
    note_ja: 中心要素や作成者が不在でも機能する性質。
  再生成性:
    en: regenerative capacity
    note_ja: 再読・再利用・再検討によって新しい理解や価値を生む性質。
  非競合性:
    en: non-rivalry
    note_ja: 共有しても価値が減らず、維持または拡大し得る性質。
  接続の欠落:
    en: missing connection
    note_ja: 要素自体ではなく、順序・責任・情報流などの接続が欠けた状態。
  対象へ返して検証する:
    en: return the structure to the target for validation
    note_ja: 外部体系の権威ではなく、対象側の事実・目的・意図・条件で採否を決める。
  体癖:
    en: Taiheki
    note_ja: 英訳では固有名詞として保持し、body-pattern typologyを補足説明に使う。
  触媒的発見:
    en: catalytic discovery
    note_ja: 異質な概念との出会いを触媒として問いの見え方が組み替わる体験。体系は触媒であり、調査・診断では所見の成分（根拠）にはならない。
  構造核:
    en: structural core
    note_ja: 全体を分ける類型と分節原理、遷移と位相、状態ごとの実践知。系譜は示し、文化的な変異や装飾は一段下げて扱う。
  実践の層:
    en: practice layer
    note_ja: 各状態で注意を向ける先、ふさわしい行為、避けること、現実との結び方。割当・帰属の判定には使わない。
  仮の生成規則:
    en: provisional generative rule
    note_ja: 体系の規則を帰納された要約ではなく、世界を生む規則として仮に扱う構え。仮定の句を候補から外さない。
  照らす:
    en: illuminate
    note_ja: 視点を移して候補の由来・仮定・射程を見えるようにすること。判定、削除、関門ではない。
  灯り:
    en: lantern
    note_ja: 候補が携える任意の印（origin、as_if、whole_view、reach）。固定の記入欄ではない。
