name: Bug report
description: Report incorrect activation, missing content, or packaging problems
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Codex, Claude Code, ChatGPT GPT, Microsoft 365 Copilot, Canonical docs, Build scripts]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
