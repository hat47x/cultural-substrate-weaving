name: Validate

on:
  push:
    branches:
      - main
      - "develop/**"
      - "release/**"
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify branch version contract
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${HEAD_REF}"
          fi
          python scripts/check_branch_version.py --ref "${ref}" --version-file VERSION
      - name: One-shot sync reviewed translations and generated artifacts
        if: github.event_name == 'pull_request' && github.head_ref == 'integrate/v0.4.0-v40-baseline'
        shell: bash
        run: |
          python scripts/update_translation_hashes.py --locale en-US
          python scripts/build.py
          git add i18n/translation-manifest.json .claude-plugin .agents plugins
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sync v0.4 integration artifacts"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Run validation
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]] || \
             [[ "${GITHUB_REF_NAME}" == release/* ]] || \
             [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${BASE_REF}" == "main" ]]; then
            make release-check
          else
            make check
          fi
      - name: Verify tracked generated artifacts are current
        run: git diff --exit-code -- .claude-plugin .agents plugins
      - uses: actions/upload-artifact@v7
        with:
          name: multilingual-validation-reports
          path: dist/reports/
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: dist/packages/
          if-no-files-found: ignore
