name: Validate

on:
  push:
    branches:
      - main
      - "develop/**"
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run validation
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]] || \
             [[ "${GITHUB_REF_NAME}" == release/* ]] || \
             [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${BASE_REF}" == "main" ]]; then
            make release-check
          else
            make check
          fi
      - name: Verify tracked generated artifacts are current
        run: git diff --exit-code -- .claude-plugin .agents plugins
      - uses: actions/upload-artifact@v7
        with:
          name: multilingual-validation-reports
          path: dist/reports/
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: dist/packages/
          if-no-files-found: ignore
