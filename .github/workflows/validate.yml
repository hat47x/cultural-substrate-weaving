name: Validate

on:
  push:
    branches:
      - main
      - "develop/**"
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify branch version contract
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${HEAD_REF}"
          fi

          case "${ref}" in
            develop/v*|release/v*)
              expected="${ref#*/v}"
              actual="$(tr -d '\r\n' < VERSION)"
              if [[ "${actual}" != "${expected}" ]]; then
                echo "VERSION mismatch: branch ${ref} expects ${expected}, found ${actual}" >&2
                exit 1
              fi
              ;;
          esac
      - name: Run validation
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]] || \
             [[ "${GITHUB_REF_NAME}" == release/* ]] || \
             [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${BASE_REF}" == "main" ]]; then
            make release-check
          else
            make check
          fi
      - name: Verify tracked generated artifacts are current
        run: git diff --exit-code -- .claude-plugin .agents plugins
      - uses: actions/upload-artifact@v7
        with:
          name: multilingual-validation-reports
          path: dist/reports/
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: dist/packages/
          if-no-files-found: ignore
