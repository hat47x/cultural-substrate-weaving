name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re-)publish assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make release-check
      - name: Verify tag and VERSION
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: test "${TAG#v}" = "$(cat VERSION)"
      - name: Verify changelog release boundary
        run: python scripts/check_release_changelog.py --version "$(cat VERSION)" --changelog CHANGELOG.md
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/release-assets.txt"
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/release-manifest.json").read_text(encoding="utf-8"))
          for relative in manifest["release_assets"]:
              path = Path("dist") / relative
              if not path.is_file():
                  raise SystemExit(f"release asset missing after validation: {path}")
              print(path.as_posix())
          PY

          mapfile -t ASSETS < "$RUNNER_TEMP/release-assets.txt"
          if (( ${#ASSETS[@]} == 0 )); then
            echo "release manifest declared no assets" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            NOTES="$(cat .github/release-validation-note.md)"
            gh release create "$TAG" "${ASSETS[@]}" --verify-tag --generate-notes --notes "$NOTES"
          fi
